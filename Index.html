<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ketabna EG | كتب PDF</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #ffffff;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #00000010;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #3157d5;
    }

    nav a {
      text-decoration: none;
      color: #555;
      margin-right: 20px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px;
      background: linear-gradient(135deg, #3157d5, #713fd4);
      color: white;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 600px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .title {
      margin-bottom: 25px;
      font-size: 27px;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

    .book {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 18px #00000012;
      transition: 0.2s;
    }

    .book:hover {
      transform: translateY(-5px);
    }

    .cover {
      height: 180px;
      border-radius: 12px;
      background: #e9edff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 15px;
    }

    .book h3 {
      margin-bottom: 8px;
    }

    .book p {
      color: #777;
      margin-bottom: 15px;
    }

    .btn {
      display: block;
      text-align: center;
      background: #3157d5;
      color: white;
      text-decoration: none;
      padding: 11px;
      border-radius: 9px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      text-align: center;
      background: #172033;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📚 Ketabna EG</div>

  <nav>
    <a href="#">الرئيسية</a>
    <a href="#books">الكتب</a>
  </nav>
</header>

<section class="hero">
  <h1>كتبك في مكان واحد 📚</h1>
  <p>اكتشف الكتب والملفات التعليمية المتاحة للقراءة والتحميل</p>

  <input
    class="search"
    type="text"
    placeholder="ابحث عن كتاب..."
    onkeyup="searchBooks()"
    id="searchBox"
  >
</section>

<main class="container" id="books">

  <h2 class="title">📖 أحدث الكتب</h2>

  <div class="books">

    <div class="book">
      <div class="cover">📕</div>
      <h3>كتاب تجريبي</h3>
      <p>قسم الكتب التعليمية</p>
      <a class="btn" href="#">قراءة الكتاب</a>
    </div>

    <div class="book">
      <div class="cover">📘</div>
      <h3>كتاب تجريبي 2</h3>
      <p>قسم المراجعات</p>
      <a class="btn" href="#">قراءة الكتاب</a>
    </div>

    <div class="book">
      <div class="cover">📗</div>
      <h3>كتاب تجريبي 3</h3>
      <p>كتب متنوعة</p>
      <a class="btn" href="#">قراءة الكتاب</a>
    </div>

  </div>

</main>

<footer>
  © 2026 Ketabna EG — جميع الحقوق محفوظة
</footer>

<script>
function searchBooks() {
  let input = document.getElementById("searchBox").value.toLowerCase();
  let books = document.querySelectorAll(".book");

  books.forEach(function(book) {
    let title = book.querySelector("h3").innerText.toLowerCase();

    if (title.includes(input)) {
      book.style.display = "block";
    } else {
      book.style.display = "none";
    }
  });
}
</script>

</body>
</html>
